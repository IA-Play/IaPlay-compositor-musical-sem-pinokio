  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#040405', // Suno deep black
            surface: '#121214', // Suno dark grey card
            primary: '#ff6b3d', // Suno orange-peach brand accent
            secondary: '#ff5a5f', // Suno rose accent
            accent: '#e2b714', // Suno gold

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #040405;
      color: #e4e4e7;
    }

    /* Glassmorphism System - Suno/Antigravity Premium */
    .glass-panel {
      background: rgba(4, 4, 5, 0.7);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0) 100%);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .neon-glow {
      box-shadow: 0 0 40px rgba(255, 107, 61, 0.1);
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .animate-shimmer {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite linear;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #040405;
    }

    ::-webkit-scrollbar-thumb {
      background: #1c1c1f;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #28282c;
    }
  </style>
